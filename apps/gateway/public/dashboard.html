<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>jev-route</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1c1a; --muted: #6d6a63; --line: #e3e0d8;
    --accent: #2f5d50; --accent-ink: #ffffff; --good: #2f7a4a; --bad: #b13c2e; --warn: #9a6a12;
    --code: #f0eee8; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --panel: #1e1e1c; --ink: #ecebe6; --muted: #9c998f; --line: #33322e;
      --accent: #7fc0a8; --accent-ink: #10201b; --good: #74c690; --bad: #ef8a7c; --warn: #e2b25c; --code: #262623; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 18px 24px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; }
  h1 span { color: var(--muted); font-weight: 400; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  main { max-width: 1180px; margin: 0 auto; padding: 24px; display: grid; gap: 20px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .tile .k { color: var(--muted); font-size: 12px; }
  .tile .v { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 20px; }
  @media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } main { padding: 16px; } header { padding: 14px 16px; } }
  textarea, input, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
  textarea { min-height: 96px; resize: vertical; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; align-items: center; }
  .row > * { flex: 1 1 140px; }
  button { font: inherit; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 8px 14px; cursor: pointer; flex: 0 0 auto; }
  button.ghost { background: transparent; color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: default; }
  #keybox { display: flex; gap: 8px; align-items: center; }
  #keybox input { width: 240px; }
  pre, .out { font-family: var(--mono); font-size: 13px; background: var(--code); border-radius: 8px; padding: 12px; overflow: auto; white-space: pre-wrap; word-break: break-word; margin: 0; max-height: 420px; }
  .route { margin-top: 12px; font-size: 14px; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; color: var(--muted); margin-right: 4px; white-space: nowrap; }
  .pill.jev { color: var(--accent); border-color: var(--accent); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .scroll { overflow-x: auto; }
  .completed { color: var(--good); } .failed { color: var(--bad); } .cancelled, .in_progress { color: var(--warn); }
  .muted { color: var(--muted); }
  .tool { color: var(--muted); }
  .bar { height: 8px; border-radius: 4px; background: var(--accent); }
  .mix td { border: 0; padding: 4px 6px; }
</style>
</head>
<body>
<header>
  <h1>jev-route <span>· agent harnesses, routed by Jev</span></h1>
  <div id="keybox"><input id="key" type="password" placeholder="API key (if required)" autocomplete="off" /><button class="ghost" id="saveKey">Save</button></div>
</header>
<main>
  <section class="tiles" id="tiles"></section>

  <section class="grid2">
    <div class="panel">
      <h2>Playground</h2>
      <textarea id="prompt" placeholder="Describe a task, e.g. “Add input validation to the signup handler and write tests”"></textarea>
      <div class="row">
        <select id="harness"><option value="auto">auto (Jev picks)</option></select>
        <select id="objective"><option value="balanced">balanced</option><option value="cheapest">cheapest</option><option value="best">best</option></select>
        <input id="budget" type="number" min="0" step="0.01" placeholder="max $ (optional)" />
      </div>
      <div class="row">
        <button id="run">Run</button>
        <button class="ghost" id="dry">Route only</button>
        <button class="ghost" id="cancel" disabled>Cancel</button>
        <span id="status" class="muted" style="flex:1 1 auto"></span>
      </div>
      <div id="route" class="route"></div>
      <div class="out" id="out" style="margin-top:12px; min-height: 60px;"></div>
    </div>
    <div class="panel">
      <h2>Routing mix</h2>
      <table class="mix" id="mix"></table>
      <h2 style="margin-top:18px">Harnesses</h2>
      <div id="harnesses"></div>
    </div>
  </section>

  <section class="panel">
    <h2>Recent runs</h2>
    <div class="scroll"><table id="runs"></table></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let apiKey = "";
try { apiKey = localStorage.getItem("jevRouteKey") || ""; } catch {}
$("key").value = apiKey;
$("saveKey").onclick = () => { apiKey = $("key").value.trim(); try { localStorage.setItem("jevRouteKey", apiKey); } catch {} refresh(); };

const headers = () => ({ "Content-Type": "application/json", ...(apiKey ? { Authorization: "Bearer " + apiKey } : {}) });
const api = async (path, init = {}) => {
  const res = await fetch(path, { ...init, headers: { ...headers(), ...(init.headers || {}) } });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body?.error?.message || res.statusText);
  return body;
};
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const usd = (v) => v == null ? "—" : v < 0.01 ? "$" + v.toFixed(4) : "$" + v.toFixed(2);
const ms = (v) => v == null ? "—" : v < 1000 ? v + " ms" : (v / 1000).toFixed(1) + " s";
const DIFF = ["", "trivial", "easy", "moderate", "hard", "very hard"];

function body() {
  const b = { input: $("prompt").value, metadata: { harness_id: $("harness").value }, routing: { objective: $("objective").value } };
  const max = parseFloat($("budget").value);
  if (max > 0) b.routing.max_cost_usd = max;
  return b;
}

function renderRoute(d) {
  if (!d) { $("route").innerHTML = ""; return; }
  const cands = (d.candidates || []).map((c) =>
    `<tr><td>${esc(c.option_id)}</td><td class="num">${c.score.toFixed(2)}</td><td class="num">${usd(c.est_cost_usd)}</td><td class="num">${c.jev_preference.toFixed(2)}</td><td class="num">${c.prior_bonus.toFixed(2)}</td></tr>`).join("");
  $("route").innerHTML = `
    <div><span class="pill ${d.source === "jev" || d.source === "cache" ? "jev" : ""}">${esc(d.source)}</span>
    <span class="pill">${esc(d.features.task_type)}</span><span class="pill">${DIFF[d.features.difficulty]}</span>
    <span class="pill">${esc(d.latency_ms)} ms</span></div>
    <p style="margin:8px 0"><b>${esc(d.harness)}</b> · ${esc(d.model)}${d.effort ? " · effort " + esc(d.effort) : ""} · est. ${usd(d.est_cost_usd)}<br><span class="muted">${esc(d.reason)}${d.fallback_reason ? " — fallback: " + esc(d.fallback_reason) : ""}</span></p>
    ${cands ? `<div class="scroll"><table><tr><th>candidate</th><th class="num">score</th><th class="num">est.</th><th class="num">jev</th><th class="num">prior</th></tr>${cands}</table></div>` : ""}`;
}

$("dry").onclick = async () => {
  $("status").textContent = "routing…";
  try { renderRoute(await api("/v1/route", { method: "POST", body: JSON.stringify(body()) })); $("status").textContent = ""; }
  catch (e) { $("status").textContent = e.message; }
};

let currentId = null;
$("cancel").onclick = async () => { if (currentId) await api(`/v1/responses/${currentId}/cancel`, { method: "POST" }).catch(() => {}); };

$("run").onclick = async () => {
  $("out").textContent = ""; renderRoute(null); $("run").disabled = true; $("status").textContent = "starting…";
  try {
    const res = await fetch("/v1/responses", { method: "POST", headers: headers(), body: JSON.stringify({ ...body(), stream: true }) });
    if (!res.ok) { const b = await res.json().catch(() => ({})); throw new Error(b?.error?.message || res.statusText); }
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = "";
    while (true) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const frame = buf.slice(0, i); buf = buf.slice(i + 2);
        const line = frame.split("\n").find((l) => l.startsWith("data: ")); if (!line) continue;
        onEvent(JSON.parse(line.slice(6)));
      }
    }
  } catch (e) { $("status").textContent = e.message; }
  $("run").disabled = false; $("cancel").disabled = true; currentId = null; refresh();
};

function onEvent(e) {
  const out = $("out");
  if (e.type === "response.created") {
    currentId = e.response.id; $("cancel").disabled = false;
    renderRoute(e.response.metadata.route); $("status").textContent = "running…";
  } else if (e.type === "response.output_text.delta") {
    out.append(document.createTextNode(e.delta));
  } else if (e.type === "response.output_item.done" && e.item.type === "function_call") {
    const span = document.createElement("div"); span.className = "tool";
    span.textContent = `⚙ ${e.item.name} ${e.item.arguments.slice(0, 140)}`; out.append(span);
  } else if (e.type === "response.output_item.done" && e.item.type === "message") {
    out.append(document.createTextNode("\n"));
  } else if (e.type === "response.completed" || e.type === "response.failed" || e.type === "response.incomplete") {
    const r = e.response;
    $("status").innerHTML = `<span class="${esc(r.status)}">${esc(r.status)}</span> · ${usd(r.metadata.cost_usd)} · ${ms(r.metadata.duration_ms)}${r.error ? " · " + esc(r.error.message) : ""}`;
  }
}

async function refresh() {
  try {
    const [stats, runs, harnesses] = await Promise.all([api("/v1/stats"), api("/v1/responses?limit=30"), api("/v1/harnesses")]);
    const t = stats.totals || {};
    const rate = t.runs ? Math.round((100 * (t.completed || 0)) / t.runs) + "%" : "—";
    const s = stats.savings;
    $("tiles").innerHTML = [
      ["Runs", t.runs ?? 0], ["Success rate", rate], ["Spend", usd(t.cost_usd || 0)],
      ["Saved vs top-tier", s && s.runs_counted ? usd(Math.max(0, s.saved_usd)) : "—"],
      ["Avg duration", ms(t.avg_duration_ms ? Math.round(t.avg_duration_ms) : null)],
    ].map(([k, v]) => `<div class="tile"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join("");

    const byOpt = stats.by_option || []; const max = Math.max(1, ...byOpt.map((o) => o.runs));
    $("mix").innerHTML = byOpt.length ? byOpt.map((o) => `<tr><td style="width:55%">${esc(o.option_id || o.harness + ":" + o.model)}</td><td style="width:35%"><div class="bar" style="width:${(100 * o.runs) / max}%"></div></td><td class="num">${o.runs}</td></tr>`).join("") : `<tr><td class="muted">No runs yet.</td></tr>`;

    const sel = $("harness"); const cur = sel.value;
    sel.innerHTML = harnesses.data.map((h) => `<option value="${esc(h.id)}" ${h.available ? "" : "disabled"}>${h.id === "auto" ? "auto (Jev picks)" : esc(h.name)}${h.available ? "" : " — unavailable"}</option>`).join("");
    sel.value = cur || "auto";
    $("harnesses").innerHTML = harnesses.data.filter((h) => h.id !== "auto").map((h) =>
      `<div style="margin-bottom:6px"><b>${esc(h.name)}</b> <span class="${h.available ? "completed" : "failed"}">${h.available ? "ready" : "unavailable"}</span>${h.unavailable_reasons ? `<div class="muted" style="font-size:12px">${esc(h.unavailable_reasons.join("; "))}</div>` : ""}</div>`).join("");

    $("runs").innerHTML = `<tr><th>when</th><th>task</th><th>routed to</th><th>via</th><th>status</th><th class="num">est.</th><th class="num">cost</th><th class="num">time</th></tr>` +
      runs.data.map((r) => `<tr><td class="muted">${new Date(r.created_at * 1000).toLocaleTimeString()}</td>
        <td>${esc(r.input_preview)}<div class="muted" style="font-size:12px">${esc(r.task_type || "")}${r.difficulty ? " · " + DIFF[r.difficulty] : ""}</div></td>
        <td>${esc(r.harness_id)}<div class="muted" style="font-size:12px">${esc(r.model)}${r.reasoning_effort ? " · " + esc(r.reasoning_effort) : ""}</div></td>
        <td><span class="pill ${r.route_source === "jev" || r.route_source === "cache" ? "jev" : ""}">${esc(r.route_source)}</span></td>
        <td class="${esc(r.status)}">${esc(r.status)}</td><td class="num">${usd(r.est_cost_usd)}</td><td class="num">${usd(r.cost_usd)}</td><td class="num">${ms(r.duration_ms)}</td></tr>`).join("");
  } catch (e) {
    $("tiles").innerHTML = `<div class="tile"><div class="k">Error</div><div class="v" style="font-size:15px">${esc(e.message)}</div></div>`;
  }
}
refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
