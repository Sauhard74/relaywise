<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&display=block" rel="stylesheet" />
<style>
  html, body { margin: 0; background: transparent; }
  .card {
    width: 1600px; height: 460px; position: relative; overflow: hidden;
    background: radial-gradient(900px 420px at 24% 55%, #0f3a3c 0%, #0b1d20 45%, #081417 100%);
    font-family: "Schibsted Grotesk", sans-serif;
  }
  svg.bg { position: absolute; inset: 0; }
  .mascot { position: absolute; left: 150px; top: 38px; }
  .words { position: absolute; left: 700px; top: 118px; }
  .wordmark { font-size: 132px; font-weight: 800; letter-spacing: -0.05em; color: #f2fbfa; line-height: 1; }
  .wordmark span { color: #30d5c8; }
  .tag { margin-top: 26px; font-size: 30px; font-weight: 700; letter-spacing: 0.28em; color: #30d5c8; }
  .sub { margin-top: 20px; font-size: 27px; font-weight: 400; color: #9bb7b9; letter-spacing: -0.005em; }
</style>
</head>
<body>
<div class="card" id="card">
  <!-- the track: four agent lanes with routed runs, like the dashboard's routing board -->
  <svg class="bg" width="1600" height="460" viewBox="0 0 1600 460">
    <g stroke="#1b4448" stroke-width="1.5">
      <line x1="0" y1="118" x2="1600" y2="118" />
      <line x1="0" y1="206" x2="1600" y2="206" />
      <line x1="0" y1="294" x2="1600" y2="294" />
      <line x1="0" y1="382" x2="1600" y2="382" />
    </g>
    <g fill="#30d5c8">
      <circle cx="60" cy="118" r="4" opacity=".35" /><circle cx="560" cy="118" r="3" opacity=".3" /><circle cx="1240" cy="118" r="5" opacity=".28" /><circle cx="1510" cy="118" r="3" opacity=".35" />
      <circle cx="90" cy="206" r="3" opacity=".3" /><circle cx="610" cy="206" r="6" opacity=".22" /><circle cx="1420" cy="206" r="4" opacity=".3" />
      <circle cx="40" cy="294" r="5" opacity=".25" /><circle cx="580" cy="294" r="3" opacity=".35" /><circle cx="1330" cy="294" r="3" opacity=".3" /><circle cx="1560" cy="294" r="6" opacity=".2" />
      <circle cx="120" cy="382" r="3" opacity=".3" /><circle cx="520" cy="382" r="4" opacity=".25" /><circle cx="1180" cy="382" r="3" opacity=".3" /><circle cx="1470" cy="382" r="4" opacity=".28" />
    </g>
  </svg>

  <svg class="mascot" width="440" height="400" viewBox="0 0 440 400">
    <defs>
      <radialGradient id="body" cx="40%" cy="34%" r="70%">
        <stop offset="0" stop-color="#6ff0e4" />
        <stop offset=".55" stop-color="#30d5c8" />
        <stop offset="1" stop-color="#169f95" />
      </radialGradient>
      <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="16" result="b" />
        <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
      </filter>
      <linearGradient id="baton" x1="0" x2="1">
        <stop offset="0" stop-color="#ffb35c" /><stop offset="1" stop-color="#ff7a59" />
      </linearGradient>
    </defs>
    <!-- speed lines -->
    <g stroke="#30d5c8" stroke-linecap="round" opacity=".55">
      <line x1="18" y1="160" x2="92" y2="160" stroke-width="7" />
      <line x1="40" y1="205" x2="98" y2="205" stroke-width="7" />
      <line x1="8" y1="250" x2="90" y2="250" stroke-width="7" />
    </g>
    <!-- ground shadow on the lane -->
    <ellipse cx="226" cy="368" rx="118" ry="12" fill="#000" opacity=".35" />
    <!-- back leg (mid-stride) -->
    <path d="M178 300 L150 352" stroke="#139188" stroke-width="30" stroke-linecap="round" />
    <!-- front leg -->
    <path d="M250 304 L292 346" stroke="#1bb2a7" stroke-width="30" stroke-linecap="round" />
    <!-- body -->
    <circle cx="220" cy="198" r="122" fill="url(#body)" filter="url(#glow)" />
    <!-- antennae, swept back by speed -->
    <path d="M196 84 C 180 50, 150 42, 128 46" stroke="#30d5c8" stroke-width="9" fill="none" stroke-linecap="round" />
    <path d="M246 82 C 236 44, 206 30, 186 30" stroke="#30d5c8" stroke-width="9" fill="none" stroke-linecap="round" />
    <!-- eyes looking ahead -->
    <circle cx="228" cy="176" r="21" fill="#0b1d20" /><circle cx="236" cy="170" r="7.5" fill="#bffaf3" />
    <circle cx="294" cy="176" r="21" fill="#0b1d20" /><circle cx="302" cy="170" r="7.5" fill="#bffaf3" />
    <!-- determined little smile -->
    <path d="M250 222 Q 266 236 282 222" stroke="#0b1d20" stroke-width="6" fill="none" stroke-linecap="round" />
    <!-- back arm -->
    <ellipse cx="108" cy="224" rx="27" ry="34" fill="#128a81" stroke="#0b5f59" stroke-width="4" transform="rotate(-28 108 224)" />
    <!-- baton, held out front, ready to hand off -->
    <g transform="rotate(-24 360 206)">
      <rect x="318" y="190" width="104" height="30" rx="15" fill="url(#baton)" />
      <rect x="318" y="190" width="104" height="10" rx="5" fill="#ffffff" opacity=".22" />
    </g>
    <!-- front arm gripping the baton -->
    <ellipse cx="340" cy="226" rx="27" ry="31" fill="#1fb8ac" stroke="#0e756e" stroke-width="4" transform="rotate(20 340 226)" />
  </svg>

  <div class="words">
    <div class="wordmark">relaywise<span>.</span></div>
    <div class="tag">PASS THE BATON.</div>
    <div class="sub">Every coding task goes to the right agent, model and effort.</div>
  </div>
</div>
</body>
</html>
